services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zamon
      POSTGRES_USER: zamon
      POSTGRES_PASSWORD: zamon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zamon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://zamon:zamon@db:5432/zamon
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SEED_ON_START: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media

  celery:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me}
      DATABASE_URL: postgres://zamon:zamon@db:5432/zamon
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    entrypoint: []
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media:
