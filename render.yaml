# ════════════════════════════════════════════════════════════════════════
#  ZAMON MARKET — Render Blueprint (BITTA SERVIS)
#  Django butun saytni (web + API + admin) bitta servisda beradi.
#  Alohida frontend deploy SHART EMAS.
#  render.com → "New" → "Blueprint" → bu repozitoriyni tanlang.
# ════════════════════════════════════════════════════════════════════════
databases:
  - name: zamon-db
    databaseName: zamon
    user: zamon
    plan: free

services:
  - type: web
    name: zamon-market
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      # Django asoslari
      - key: SECRET_KEY
        generateValue: true          # Render kuchli kalit yaratadi
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Baza — yuqoridagi zamon-db'dan avtomatik ulanadi
      - key: DATABASE_URL
        fromDatabase:
          name: zamon-db
          property: connectionString
      # Demo ma'lumot (105 mahsulot) birinchi ishga tushganda to'ldiriladi
      - key: SEED_ON_START
        value: "1"
      # Redis'siz ishlash (email/order task'lar darhol bajariladi)
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Sayt o'zining domeni (RENDER_EXTERNAL_HOSTNAME settings'da avtomatik
      # ALLOWED_HOSTS va CSRF_TRUSTED_ORIGINS'ga qo'shiladi).
      # FRONTEND_URL faqat to'lov redirectlari uchun — o'z domeningizga qo'ying:
      - key: FRONTEND_URL
        value: "https://zamon-market.onrender.com"
