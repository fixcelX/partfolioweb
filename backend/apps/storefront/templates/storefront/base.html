{% load static store i18n %}
<!DOCTYPE html>
<html lang="{{ current_lang }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#ff7a00">
  <meta name="description" content="{% block meta_description %}{{ t.footer.about }}{% endblock %}">
  <title>{% block title %}{{ t.brand }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'storefront/css/app.css' %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ff7a00'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Arial' font-weight='900' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">

  <script>
    // Mavzuni paint'dan oldin o'rnatish (miltillashning oldini olish)
    (function () {
      try {
        var t = localStorage.getItem("zm-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  {% include "storefront/partials/_header.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "storefront/partials/_footer.html" %}

  <button class="to-top js-to-top" aria-label="{{ t.common.backHome }}">{% icon "arrow-up" %}</button>

  <script>
    window.ZM_I18N = {
      added: "{{ t.product.added|escapejs }}",
      error: "{{ t.common.error|escapejs }}",
      wishAdded: "{{ t.wishlist.added|escapejs }}",
      wishRemoved: "{{ t.wishlist.removed|escapejs }}",
      viewAllResults: "{{ t.nav.viewAllResults|escapejs }}"
    };
    window.ZM_URLS = {
      cartAdd: "{% url 'storefront:cart_add' %}",
      cartUpdate: "{% url 'storefront:cart_update' %}",
      cartRemove: "{% url 'storefront:cart_remove' %}",
      cartDrawer: "{% url 'storefront:cart_drawer' %}",
      wishToggle: "{% url 'storefront:wishlist_toggle' %}",
      searchSuggest: "{% url 'storefront:search_suggest' %}"
    };
  </script>
  <script src="{% static 'storefront/js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
